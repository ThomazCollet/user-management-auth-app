spring:
  application:
    name: user-management-auth-app

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Deixa o gerenciamento da estrutura das tabelas para o Flyway!
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
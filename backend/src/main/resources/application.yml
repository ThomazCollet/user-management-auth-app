server:
  port: 8080

spring:
  application:
    name: user-management-auth-app

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Deixa o gerenciamento da estrutura das tabelas para o Flyway!
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Correção do item 2.2: Prefixo correto para os timeouts do OpenFeign
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

integrations:
  viacep:
    url: https://viacep.com.br/ws

# Configuração customizada para o JWT e tempo de expiração
api:
  security:
    token:
      secret: ${JWT_SECRET:minha-chave-secreta-super-segura-padrao}
      expiration-hours: 2 # Centralizado aqui para o TokenService ler se preferir!